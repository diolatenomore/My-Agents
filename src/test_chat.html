<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat 测试</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; height: 100vh; display: flex; }
  :root { --sidebar: 320px; }
  .sidebar { width: var(--sidebar); background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  .sidebar h2 { font-size: 14px; padding: 12px 16px; border-bottom: 1px solid #eee; color: #666; }
  .session-list { flex: 1; overflow-y: auto; padding: 8px; }
  .session-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; font-size: 13px; }
  .session-item:hover { background: #f0f0f0; }
  .session-item.active { background: #e3f2fd; }
  .session-item .title-row { display: flex; align-items: center; gap: 6px; }
  .session-item .title { font-weight: 500; color: #333; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .edit-btn { flex-shrink: 0; width: 22px; height: 22px; padding: 0; font-size: 10px; border-radius: 4px; background: transparent; color: #999; border: none; cursor: pointer; line-height: 22px; text-align: center; display: none; }
  .session-item:hover .edit-btn { display: inline-block; }
  .session-item .edit-btn:hover { background: #e0e0e0; color: #333; }
  .session-item .meta { font-size: 11px; color: #999; margin-top: 2px; }
  .sidebar-actions { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
  .sidebar-actions button { flex: 1; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 12px; }
  .header .sid { font-size: 12px; color: #999; font-family: monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
  .msg.user { background: #e3f2fd; align-self: flex-end; }
  .msg.assistant { background: #fff; border: 1px solid #e0e0e0; align-self: flex-start; }
  .msg.system { background: #fff3e0; align-self: center; font-size: 12px; padding: 6px 12px; border-radius: 6px; max-width: 100%; }
  .msg.tool-call { background: #f3e5f5; align-self: flex-start; font-family: monospace; font-size: 13px; }
  .msg.tool-call.approval-pending { border: 2px solid #ff9800; }
  .approval-actions { display: flex; gap: 8px; margin-top: 8px; }
  .approval-actions button { padding: 4px 14px; font-size: 12px; border-radius: 4px; }
  .approval-actions .approve-btn { background: #2e7d32; }
  .approval-actions .approve-btn:hover { background: #1b5e20; }
  .approval-actions .reject-btn { background: #c62828; }
  .approval-actions .reject-btn:hover { background: #b71c1c; }
  .approval-actions .approve-raise-btn { background: #1565c0; }
  .approval-actions .approve-raise-btn:hover { background: #0d47a1; }
  .raise-limit-group { display: flex; align-items: center; gap: 4px; }
  .msg.tool-result { background: #e8f5e9; align-self: flex-start; font-family: monospace; font-size: 13px; }
  .msg .label { font-weight: 600; font-size: 11px; color: #666; margin-bottom: 4px; text-transform: uppercase; }
  .msg .content { white-space: pre-wrap; word-break: break-word; }
  .token-stream { display: inline; }
  .token-cursor::after { content: '▊'; animation: blink 1s step-end infinite; color: #1976d2; }
  @keyframes blink { 50% { opacity: 0; } }
  .input-area { padding: 16px 20px; background: #fff; border-top: 1px solid #ddd; display: flex; gap: 10px; }
  #input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; font-size: 14px; resize: none; outline: none; font-family: inherit; }
  #input:focus { border-color: #1976d2; }
  button { background: #1976d2; color: #fff; border: none; border-radius: 8px; padding: 10px 24px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1565c0; }
  button:disabled { background: #90caf9; cursor: not-allowed; }
  button.danger { background: #d32f2f; }
  button.danger:hover { background: #b71c1c; }
  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; }
  pre.json { font-size: 12px; background: #f5f5f5; padding: 8px; border-radius: 4px; overflow-x: auto; max-height: 200px; }
  .review-panel { margin: 0 20px 12px; background: #fff; border: 1px solid #e0e0e0; border-radius: 0 0 8px 8px; overflow: hidden; display: none; flex-direction: column; }
  .review-panel.show { display: flex; }
  .review-resize-bar { height: 6px; background: #e0e0e0; cursor: ns-resize; flex-shrink: 0; transition: background 0.15s; }
  .review-resize-bar:hover { background: #1976d2; }
  .review-resize-bar:active { background: #1565c0; }
  .review-panel .title { padding: 10px 14px; font-size: 14px; font-weight: 600; background: #fafafa; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .review-panel .body { flex: 1; overflow-y: auto; }
  .review-panel .title .badge { background: #1976d2; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .review-panel .actions { display: flex; gap: 8px; margin-left: auto; }
  .review-panel .actions button { padding: 4px 16px; font-size: 12px; }
  .review-panel .actions button.approve { background: #2e7d32; }
  .review-panel .actions button.approve:hover { background: #1b5e20; }
  .review-panel .actions button.reject { background: #c62828; }
  .review-panel .actions button.reject:hover { background: #b71c1c; }
  .review-item { padding: 8px 14px; font-size: 13px; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; gap: 6px; }
  .review-item .op-icon { width: 20px; font-size: 13px; text-align: center; }
  .review-item .op-label { font-size: 12px; color: #555; white-space: nowrap; margin-right: 2px; }
  .review-item .op-path { flex: 1; font-family: monospace; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .review-item .op-copy { font-size: 11px; color: #999; margin-left: 4px; white-space: nowrap; }
  .review-item .op-status { font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .review-item .op-status.pending { background: #fff3e0; color: #e65100; }
  .review-item .op-status.approved { background: #e8f5e9; color: #2e7d32; }
  .review-item .op-status.rejected { background: #ffebee; color: #c62828; }
  .review-item.dir { font-weight: 600; background: #fafafa; }
  .review-item.dir .op-path { font-size: 13px; }
  .review-item .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .review-item .item-actions button { padding: 2px 10px; font-size: 11px; border-radius: 4px; }
  .review-item .item-app { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .review-item .item-app:hover { background: #c8e6c9; }
  .review-item .item-rej { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  .review-item .item-rej:hover { background: #ffcdd2; }

  /* 侧边栏 tab 按钮 */
  .sidebar-tabs { display: flex; flex-direction: column; border-bottom: 1px solid #eee; }
  .sidebar-tabs button { flex: 1; padding: 10px 0; font-size: 13px; border: none; background: none; color: #666; cursor: pointer; border-radius: 0; border-bottom: 2px solid transparent; }
  .sidebar-tabs button:hover { background: #f5f5f5; color: #333; }
  .sidebar-tabs button.active { color: #1976d2; border-bottom-color: #1976d2; font-weight: 600; }

  /* 记忆管理页面 */
  .memory-page { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .memory-page .mem-toolbar { padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
  .memory-page .mem-toolbar select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
  .memory-page .mem-toolbar .mem-count { font-size: 13px; color: #666; margin-left: auto; }
  .memory-page .mem-list { flex: 1; overflow-y: auto; }
  .memory-page .mem-pagination { padding: 10px 20px; background: #fff; border-top: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; }
  .memory-page .mem-pagination span { font-size: 13px; color: #666; }
  .memory-page .mem-pagination button { padding: 6px 16px; font-size: 12px; }
  .mem-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 20px; border-bottom: 1px solid #f5f5f5; }
  .mem-row:hover { background: #fafafa; }
  .mem-type-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; font-weight: 500; flex-shrink: 0; }
  .mem-type-badge.preference { background: #e3f2fd; color: #1565c0; }
  .mem-type-badge.fact { background: #e8f5e9; color: #2e7d32; }
  .mem-type-badge.identity { background: #fff3e0; color: #e65100; }
  .mem-content { flex: 1; font-size: 13px; line-height: 1.5; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mem-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .mem-actions button { padding: 4px 12px; font-size: 11px; border-radius: 4px; }
  .mem-actions button.edit-btn { background: #f5f5f5; color: #333; }
  .mem-actions button.edit-btn:hover { background: #e0e0e0; }
  .mem-actions button.del-btn { background: #ffebee; color: #c62828; }
  .mem-actions button.del-btn:hover { background: #ffcdd2; }

  /* 技能管理页面 */
  .skill-page { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .skill-page .skill-toolbar { padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
  .skill-page .skill-toolbar .skill-count { font-size: 13px; color: #666; margin-left: auto; }
  .skill-page .skill-list { flex: 1; overflow-y: auto; }
  .skill-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: background 0.1s; }
  .skill-row:hover { background: #fafafa; }
  .skill-row.selected { background: #e3f2fd; }
  .skill-row .skill-icon { font-size: 20px; flex-shrink: 0; }
  .skill-row .skill-info { flex: 1; min-width: 0; }
  .skill-row .skill-name { font-weight: 600; font-size: 14px; color: #333; }
  .skill-row .skill-version { font-size: 11px; color: #999; margin-left: 6px; }
  .skill-row .skill-desc { font-size: 12px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-row .skill-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .skill-row .skill-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #f0f0f0; color: #666; }
  .skill-row .skill-status { flex-shrink: 0; }
  .skill-toggle { padding: 4px 14px; font-size: 12px; border-radius: 14px; border: 1px solid #ccc; cursor: pointer; background: #f5f5f5; color: #666; transition: all 0.15s; }
  .skill-toggle.enabled { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
  .skill-toggle.disabled { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
  .skill-toggle:hover { opacity: 0.85; }

  /* 技能详情面板（弹窗） */
  .skill-modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 1000; align-items: center; justify-content: center; }
  .skill-modal-overlay.show { display: flex; }
  .skill-modal { background: #fff; border-radius: 12px; width: 480px; max-width: 90vw; max-height: 70vh; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
  .skill-modal .modal-header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .skill-modal .modal-header h3 { font-size: 15px; margin: 0; }
  .skill-modal .modal-header .close-btn { margin-left: auto; background: none; border: none; font-size: 20px; color: #999; cursor: pointer; padding: 0 4px; }
  .skill-modal .modal-header .close-btn:hover { color: #333; }
  .skill-modal .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .skill-modal .modal-body .detail-row { display: flex; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .skill-modal .modal-body .detail-label { color: #999; min-width: 48px; flex-shrink: 0; }
  .skill-modal .modal-body .detail-value { color: #333; word-break: break-word; }
  .skill-modal .modal-body .detail-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .skill-modal .modal-body .detail-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #e3f2fd; color: #1565c0; }
  .skill-modal .modal-footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 8px; flex-shrink: 0; }
  .skill-modal .modal-footer .skill-toggle { padding: 6px 18px; font-size: 13px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; background: #f5f5f5; color: #666; transition: all 0.15s; }
  .skill-modal .modal-footer .skill-toggle.enabled { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
  .skill-modal .modal-footer .skill-toggle.disabled { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
  .skill-modal .modal-footer .skill-toggle:hover { opacity: 0.85; }

  /* 模型管理页面 */
  .model-page { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .model-page .model-toolbar { padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 10px; align-items: center; }
  .model-page .model-toolbar .model-count { font-size: 13px; color: #666; margin-left: auto; }
  .model-page .model-list { flex: 1; overflow-y: auto; }
  .model-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #f5f5f5; }
  .model-row:hover { background: #fafafa; }
  .model-row .model-info { flex: 1; min-width: 0; }
  .model-row .model-name { font-weight: 600; font-size: 14px; color: #333; }
  .model-row .model-detail { font-size: 12px; color: #666; margin-top: 2px; }
  .model-row .model-status { flex-shrink: 0; }
  .model-row .model-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .model-row .model-actions button { padding: 4px 12px; font-size: 11px; border-radius: 4px; }
  .model-form { padding: 16px 20px; background: #fafafa; border-top: 1px solid #eee; display: none; }
  .model-form.show { display: block; }
  .model-form .form-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
  .model-form .form-row label { font-size: 13px; color: #333; min-width: 72px; }
  .model-form .form-row input { flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; outline: none; font-family: inherit; }
  .model-form .form-row input:focus { border-color: #1976d2; }
  .model-form .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .model-form .form-actions button { padding: 6px 20px; font-size: 13px; border-radius: 6px; }
  .model-form .form-actions .cancel-btn { background: #f5f5f5; color: #666; border: 1px solid #ddd; }
  .model-form .form-actions .cancel-btn:hover { background: #e0e0e0; }
  .adv-toggle { font-size: 13px; color: #1976d2; cursor: pointer; padding: 6px 0; margin-bottom: 8px; user-select: none; }
  .adv-toggle:hover { color: #1565c0; }
  .adv-toggle span { display: inline-block; transition: transform 0.2s; font-size: 11px; margin-right: 4px; }
  .adv-toggle.open span { transform: rotate(90deg); }
  .adv-config { padding-left: 82px; }
  .model-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .model-badge.active { background: #e8f5e9; color: #2e7d32; }

  .rename-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .rename-overlay.hidden { display: none; }
  .rename-dialog { background: #fff; border-radius: 10px; width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.18); overflow: hidden; }
  .rename-dialog .dialog-header { padding: 16px 20px; font-size: 15px; font-weight: 600; border-bottom: 1px solid #eee; }
  .rename-dialog .dialog-body { padding: 16px 20px; }
  .rename-dialog .dialog-body input { width: 100%; padding: 8px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; outline: none; font-family: inherit; }
  .rename-dialog .dialog-body input:focus { border-color: #1976d2; }
  .rename-dialog .dialog-footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 8px; justify-content: flex-end; }
  .rename-dialog .dialog-footer button { padding: 6px 20px; font-size: 13px; border-radius: 6px; }
  .rename-dialog .dialog-footer .cancel-btn { background: #f5f5f5; color: #666; border: 1px solid #ddd; }
  .rename-dialog .dialog-footer .cancel-btn:hover { background: #e0e0e0; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-tabs">
    <button id="tabMemory" onclick="showMemoryPage()">记忆</button>
    <button id="tabSkills" onclick="showSkillsPage()">技能</button>
    <button id="tabModels" onclick="showModelsPage()">模型</button>
    <button class="active" id="tabChat" onclick="showChatPage()">会话</button>
  </div>
  <div class="session-list" id="sessionList"></div>
  <div class="sidebar-actions">
    <button id="refreshSessions">刷新</button>
    <button id="newSession" class="danger">新建</button>
  </div>
</div>

<div class="main">
  <div class="header">
    <span style="font-weight:600;font-size:14px">模型:</span>
    <select id="modelSelect" style="padding:4px 8px;font-size:13px;border:1px solid #ddd;border-radius:4px;max-width:180px;" onchange="onModelChange()">
      <option value="">加载中...</option>
    </select>
    <span style="font-weight:600;font-size:14px;margin-left:12px">当前会话:</span>
    <span class="sid" id="sessionId">-</span>
    <span id="contextTokens" style="font-size:12px;color:#666;white-space:nowrap"></span>
    <button id="deleteSession" class="danger" style="padding:4px 12px;font-size:12px">删除</button>
  </div>

  <div id="messages">
    <div class="empty-state">发送消息开始对话</div>
  </div>

  <div class="input-area">
    <textarea id="input" rows="2" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
    <button id="stopBtn" onclick="stopStreaming()" style="display:none; background:#d32f2f;">停止</button>
  </div>

  <div id="reviewPanel" class="review-panel"></div>
  <div class="memory-page" id="memoryPage" style="display:none;">
    <div class="mem-toolbar">
      <span style="font-weight:600;font-size:14px;">记忆管理</span>
      <select id="memTypeFilter" onchange="loadMemories()">
        <option value="">全部类型</option>
        <option value="preference">偏好 (preference)</option>
        <option value="fact">事实 (fact)</option>
        <option value="identity">身份 (identity)</option>
      </select>
      <button onclick="loadMemories()" style="padding:6px 16px;font-size:12px;">刷新</button>
      <span class="mem-count" id="memCount">0 条</span>
    </div>
    <div class="mem-list" id="memoryList">
      <div class="empty-state">加载中...</div>
    </div>
    <div class="mem-pagination">
      <span id="memPageInfo">第 1 页</span>
      <div style="display:flex;gap:8px;">
        <button id="memPrevBtn" disabled onclick="prevMemPage()">上一页</button>
        <button id="memNextBtn" disabled onclick="nextMemPage()">下一页</button>
      </div>
    </div>
  </div>
  <div class="skill-page" id="skillPage" style="display:none;">
    <div class="skill-toolbar">
      <span style="font-weight:600;font-size:14px;">技能管理</span>
      <button onclick="loadSkills()" style="padding:6px 16px;font-size:12px;">刷新</button>
      <input type="file" id="skillUploadInput" accept=".zip" style="display:none" onchange="handleSkillUpload(this)">
      <button onclick="document.getElementById('skillUploadInput').click()" style="padding:6px 16px;font-size:12px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;">上传技能</button>
      <span class="skill-count" id="skillCount">0 个</span>
    </div>
    <div class="skill-list" id="skillList">
      <div class="empty-state">加载中...</div>
    </div>
  </div>

  <!-- 技能详情弹窗 -->
  <div class="skill-modal-overlay" id="skillModalOverlay" onclick="closeSkillDetail(event)">
    <div class="skill-modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="skillModalName"></h3>
        <button class="close-btn" onclick="closeSkillDetail()">x</button>
      </div>
      <div class="modal-body" id="skillModalBody"></div>
      <div class="modal-footer" id="skillModalFooter"></div>
    </div>
  </div>

  <!-- 模型管理页面 -->
  <div class="model-page" id="modelPage" style="display:none;">
    <div class="model-toolbar">
      <span style="font-weight:600;font-size:14px;">模型管理</span>
      <button onclick="showModelForm()" style="padding:6px 16px;font-size:12px;">新建模型</button>
      <span class="model-count" id="modelCount">0 个</span>
    </div>
    <div class="model-list" id="modelList">
      <div class="empty-state">加载中...</div>
    </div>
    <div class="model-form" id="modelForm">
      <input type="hidden" id="editModelId" value="">
      <div class="form-row">
        <label>名称</label>
        <input id="modelFormName" placeholder="如: DeepSeek 生产">
      </div>
      <div class="form-row">
        <label>Base URL</label>
        <input id="modelFormUrl" placeholder="如: https://api.deepseek.com/v1">
      </div>
      <div class="form-row">
        <label>模型</label>
        <input id="modelFormModel" placeholder="如: deepseek-v4-flash">
      </div>
      <div class="form-row">
        <label>API Key</label>
        <input id="modelFormKey" type="password" placeholder="输入 API Key">
        <button onclick="toggleApiKeyVisibility()" style="padding:6px 10px;font-size:11px;background:none;color:#666;border:1px solid #ddd;border-radius:4px;cursor:pointer;">显示</button>
      </div>
      <!-- 高级配置（可折叠） -->
      <div class="adv-toggle" onclick="toggleAdvancedConfig()">
        <span id="advArrow">&#9654;</span> 高级配置
      </div>
      <div class="adv-config" id="advConfig" style="display:none;">
        <div class="form-row">
          <label>上下文 Token 上限</label>
          <input id="modelFormCtxTokens" type="number" value="200000" placeholder="200000">
        </div>
        <div class="form-row">
          <label>最大输出 Token</label>
          <input id="modelFormMaxTokens" type="number" value="64000" placeholder="64000">
        </div>
        <div class="form-row">
          <label>单次对话最大工具调用轮数</label>
          <input id="modelFormMaxToolCalls" type="number" value="50" placeholder="50">
        </div>
        <div class="form-row">
          <label>Temperature (采样温度)</label>
          <input id="modelFormTemperature" type="number" step="0.1" min="0" max="2" value="0.7" placeholder="0.7">
        </div>
        <div class="form-row">
          <label>最大迭代次数</label>
          <input id="modelFormMaxIterations" type="number" min="1" max="100" value="30" placeholder="30">
        </div>
        <div class="form-row">
          <label>思考模式 (DeepSeek)</label>
          <select id="modelFormThink">
            <option value="1">启用</option>
            <option value="0">禁用</option>
          </select>
        </div>
        <div class="form-row">
          <label>推理强度 (OpenAI)</label>
          <select id="modelFormReasoningEffort">
            <option value="">不设置</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="cancel-btn" onclick="hideModelForm()">取消</button>
        <button onclick="saveModel()">保存</button>
      </div>
    </div>
  </div>

</div>

<script>
// ============ 状态 ============
let currentSessionId = localStorage.getItem('session_id') || '';
let selectedModelId = localStorage.getItem('selected_model_id') || '';
let modelList = []; // 模型配置列表（含 max_context_tokens）
let lastContextTokens = 0;
let isStreaming = false;
let eventSource = null;
let abortController = null;

// ============ DOM 引用 ============
const sessionListEl = document.getElementById('sessionList');
const sessionIdEl = document.getElementById('sessionId');
const contextTokensEl = document.getElementById('contextTokens');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');

// ============ Session 管理 ============

function updateContextTokensDisplay(tokens) {
  lastContextTokens = tokens || 0;
  if (tokens != null && tokens > 0) {
    const model = modelList.find(m => m.id === selectedModelId);
    const limit = model ? model.max_context_tokens : 0;
    if (limit > 0) {
      const pct = (tokens / limit * 100).toFixed(1);
      contextTokensEl.textContent = `上下文使用率 ${pct}%`;
    } else {
      contextTokensEl.textContent = `上下文 ${tokens.toLocaleString()} tokens`;
    }
  } else {
    contextTokensEl.textContent = '';
  }
}

async function refreshSessions() {
  const res = await fetch('/api/sessions');
  const data = await res.json();
  renderSessionList(data);
}

function renderSessionList(sessions) {
  sessionListEl.innerHTML = sessions.map(s => {
    const active = s.session_id === currentSessionId ? 'active' : '';
    const title = s.title || s.session_id.slice(0, 8) + '...';
    const time = s.updated_at ? new Date(s.updated_at).toLocaleString() : '';
    return `<div class="session-item ${active}" data-sid="${s.session_id}" onclick="switchSession('${s.session_id}')">
      <div class="title-row">
        <span class="title">${escapeHtml(title)}</span>
        <button class="edit-btn" onclick="event.stopPropagation();openRename('${s.session_id}','${escapeHtml(title).replace(/'/g, "\\'")}')" title="编辑标题">✎</button>
      </div>
      <div class="meta">${s.message_count} 条消息 · ${time}</div>
    </div>`;
  }).join('');
}

let renameSessionId = '';
let renameOrigTitle = '';

function openRename(sid, title) {
  renameSessionId = sid;
  renameOrigTitle = title;
  const input = document.getElementById('renameInput');
  input.value = title;
  document.getElementById('renameOverlay').classList.remove('hidden');
  input.focus();
  input.select();
}

function cancelRename() {
  document.getElementById('renameOverlay').classList.add('hidden');
  renameSessionId = '';
}

async function confirmRename() {
  const newTitle = document.getElementById('renameInput').value.trim();
  if (!newTitle || newTitle === renameOrigTitle) {
    cancelRename();
    return;
  }
  try {
    const res = await fetch(`/api/sessions/${renameSessionId}/title?title=${encodeURIComponent(newTitle)}`, { method: 'PUT' });
    if (res.ok) {
      refreshSessions();
    }
  } catch {}
  cancelRename();
}

async function switchSession(sid) {
  if (isStreaming) return;
  currentSessionId = sid;
  localStorage.setItem('session_id', sid);
  sessionIdEl.textContent = sid;
  document.getElementById('reviewPanel').classList.remove('show');
  refreshSessions();
  await loadSessionMessages(sid);
  await loadReviewTree(sid);
}

function newSession() {
  if (isStreaming) return;
  currentSessionId = '';
  localStorage.removeItem('session_id');
  sessionIdEl.textContent = '-';
  updateContextTokensDisplay(0);
  messagesEl.innerHTML = '<div class="empty-state">发送消息开始对话</div>';
  document.getElementById('reviewPanel').classList.remove('show');
  refreshSessions();
}

async function deleteCurrentSession() {
  if (!currentSessionId || isStreaming) return;
  if (!confirm('确定删除当前会话？')) return;
  await fetch(`/api/sessions/${currentSessionId}`, { method: 'DELETE' });
  newSession();
}

async function loadSessionMessages(sid) {
  if (!sid) return;
  const res = await fetch(`/api/sessions/${sid}/messages`);
  const data = await res.json();
  updateContextTokensDisplay(data.context_tokens || 0);
  messagesEl.innerHTML = '';
  if (!data.messages || data.messages.length === 0) {
    messagesEl.innerHTML = '<div class="empty-state">会话为空</div>';
    return;
  }
  for (let i = 0; i < data.messages.length; i++) {
    const m = data.messages[i];
    // 跳过 system 消息（不显示）
    if (m.role === 'system') continue;

    // user 消息
    if (m.role === 'user') {
      appendMessage('user', m.content);
      continue;
    }

    // assistant 消息：可能包含思考过程、工具调用、最终输出
    if (m.role === 'assistant') {
      // 1. 思考过程（如果有）
      if (m.reasoning_content) {
        const thinkingDiv = document.createElement('details');
        thinkingDiv.className = 'msg thinking';
        thinkingDiv.innerHTML = `<summary>思考过程</summary><div class="content">${escapeHtml(m.reasoning_content)}</div>`;
        messagesEl.appendChild(thinkingDiv);
      }

      // 2. 工具调用（如果有）—— 与后续 tool 消息配对渲染
      if (m.tool_calls && m.tool_calls.length > 0) {
        // 向前查找配对的 tool 消息，建立 tool_call_id → result 映射
        const resultMap = {};
        let j = i + 1;
        while (j < data.messages.length && data.messages[j].role === 'tool') {
          const tid = data.messages[j].tool_call_id;
          if (tid) {
            resultMap[tid] = data.messages[j].content;
          }
          j++;
        }
        // 交替渲染：每个工具调用紧跟其返回结果
        for (const tc of m.tool_calls) {
          const tcDiv = document.createElement('div');
          tcDiv.className = 'msg tool-call';
          tcDiv.innerHTML = `<div class="label">工具调用</div><div class="content">${escapeHtml(tc.name)}(${escapeHtml(JSON.stringify(tc.args))})</div>`;
          messagesEl.appendChild(tcDiv);

          const result = resultMap[tc.id];
          if (result != null) {
            const trDiv = document.createElement('div');
            trDiv.className = 'msg tool-result';
            const resultStr = typeof result === 'string' ? result.slice(0, 500) : JSON.stringify(result).slice(0, 500);
            trDiv.innerHTML = `<div class="label">${escapeHtml(tc.name)} 返回</div><div class="content">${escapeHtml(resultStr)}${resultStr.length >= 500 ? '...' : ''}</div>`;
            messagesEl.appendChild(trDiv);
          }
        }
        // 跳过已处理的 tool 消息
        i = j - 1;
      }

      // 3. 最终输出（如果有）
      if (m.content) {
        appendMessage('assistant', m.content);
      }
      continue;
    }
  }
  scrollBottom();
}

// ============ 流式聊天 ============

async function send() {
  const text = inputEl.value.trim();
  if (!text || isStreaming) return;

  inputEl.value = '';
  appendMessage('user', text);

  // 准备 session_id
  const sessionId = currentSessionId || '';
  const body = { query: text };
  if (sessionId) body.session_id = sessionId;
  if (selectedModelId) body.model_id = selectedModelId;

  // 显示 streaming 占位
  const assistantDiv = document.createElement('div');
  assistantDiv.className = 'msg assistant';
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = '思考中...';
  const contentDiv = document.createElement('div');
  contentDiv.className = 'content token-stream';
  assistantDiv.appendChild(label);
  assistantDiv.appendChild(contentDiv);
  messagesEl.appendChild(assistantDiv);

  // 隐藏空状态
  const empty = messagesEl.querySelector('.empty-state');
  if (empty) empty.remove();

  isStreaming = true;
  sendBtn.disabled = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'inline-block';
  label.innerHTML = '正在输出...<span class="token-cursor"></span>';
  let fullContent = '';
  let thinkingDetails = null;  // 思考过程 DOM 元素

  try {
    abortController = new AbortController();
    const response = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: abortController.signal,
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop() || '';

      for (const block of events) {
        const lines = block.split('\n');
        let eventType = 'message';
        let data = '';

        for (const line of lines) {
          if (line.startsWith('event: ')) eventType = line.slice(7);
          else if (line.startsWith('data: ')) data = line.slice(6);
        }

        if (!data) continue;
        let parsed;
        try { parsed = JSON.parse(data); } catch { continue; }

        switch (parsed.type) {
          case 'session_ready':
            currentSessionId = parsed.session_id;
            localStorage.setItem('session_id', currentSessionId);
            sessionIdEl.textContent = currentSessionId;
            refreshSessions();
            break;

          case 'thinking':
            if (!thinkingDetails) {
              thinkingDetails = document.createElement('details');
              thinkingDetails.className = 'msg thinking';
              thinkingDetails.innerHTML = '<summary>思考过程</summary><div class="thinking-content"></div>';
              // 插入到 assistantDiv 之前，保持正确顺序
              messagesEl.insertBefore(thinkingDetails, assistantDiv);
            }
            thinkingDetails.querySelector('.thinking-content').textContent += parsed.content;
            thinkingDetails.open = true;
            scrollBottom();
            break;

          case 'token':
            // 收到第一个可见 token 时折叠思考区（思考结束，开始输出正式回复）
            if (thinkingDetails) thinkingDetails.open = false;
            // 恢复流式输出标签（可能被 tool_call/tool_result/iteration 覆盖了）
            label.innerHTML = '正在输出...<span class="token-cursor"></span>';
            fullContent += parsed.content;
            contentDiv.textContent = fullContent;
            scrollBottom();
            break;

          case 'tool_call':
            label.textContent = `🔧 调用工具: ${parsed.name}`;
            const tcDiv = document.createElement('div');
            if (parsed.requires_approval) {
              tcDiv.className = 'msg tool-call approval-pending';
              tcDiv.innerHTML = `<div class="label">⚠️ 工具调用（需审批）</div><div class="content">${escapeHtml(parsed.name)}(${escapeHtml(JSON.stringify(parsed.args))})</div><div class="approval-actions"><button class="approve-btn">通过</button><button class="reject-btn">拒绝</button></div>`;
              messagesEl.insertBefore(tcDiv, assistantDiv);
              tcDiv.querySelector('.approve-btn').onclick = () => decideTool(parsed.tool_call_id, true, tcDiv);
              tcDiv.querySelector('.reject-btn').onclick = () => decideTool(parsed.tool_call_id, false, tcDiv);
            } else {
              tcDiv.className = 'msg tool-call';
              tcDiv.innerHTML = `<div class="label">工具调用</div><div class="content">${escapeHtml(parsed.name)}(${escapeHtml(JSON.stringify(parsed.args))})</div>`;
              messagesEl.insertBefore(tcDiv, assistantDiv);
            }
            scrollBottom();
            break;

          case 'threshold_tool_call':
            label.textContent = `⚠️ 工具调用（已达上限 ${parsed.current_tool_calls}/${parsed.max_tool_calls}）`;
            const thTcDiv = document.createElement('div');
            thTcDiv.className = 'msg tool-call approval-pending';
            thTcDiv.innerHTML = `<div class="label">⚠️ 工具调用（已达上限 ${parsed.current_tool_calls}/${parsed.max_tool_calls}，需审批）</div><div class="content">${escapeHtml(parsed.name)}(${escapeHtml(JSON.stringify(parsed.args))})</div><div class="approval-actions"><button class="reject-btn">拒绝</button><button class="approve-btn">通过</button><span class="raise-limit-group"><input class="raise-limit-input" type="number" min="1" value="5" style="width:48px;padding:2px 4px;font-size:12px;border-radius:4px;border:1px solid #666;background:#333;color:#fff;"><button class="approve-raise-btn">通过并提高上限</button></span></div>`;
            messagesEl.insertBefore(thTcDiv, assistantDiv);
            thTcDiv.querySelector('.reject-btn').onclick = () => decideTool(parsed.tool_call_id, false, thTcDiv);
            thTcDiv.querySelector('.approve-btn').onclick = () => decideTool(parsed.tool_call_id, true, thTcDiv);
            thTcDiv.querySelector('.approve-raise-btn').onclick = () => {
              const input = thTcDiv.querySelector('.raise-limit-input');
              const val = parseInt(input.value) || 1;
              decideTool(parsed.tool_call_id, true, thTcDiv, val);
            };
            scrollBottom();
            break;

          case 'tool_result':
            label.textContent = `🔧 工具返回`;
            const trDiv = document.createElement('div');
            trDiv.className = 'msg tool-result';
            const resultStr = typeof parsed.result === 'string' ? parsed.result.slice(0, 500) : JSON.stringify(parsed.result).slice(0, 500);
            trDiv.innerHTML = `<div class="label">${escapeHtml(parsed.name)} 返回</div><div class="content">${escapeHtml(resultStr)}${resultStr.length >= 500 ? '...' : ''}</div>`;
            messagesEl.insertBefore(trDiv, assistantDiv);
            // 立刻将标签切换为思考中，避免停留在"工具返回"状态
            label.textContent = '思考中...';
            scrollBottom();
            break;

          case 'done':
            label.textContent = '完成';
            if (parsed.finish_reason === 'length') {
              label.textContent += ' (输出达到上限，内容可能不完整)';
            }
            // 更新上下文 token 数（常驻 header 展示）
            if (parsed.context_tokens != null) {
              updateContextTokensDisplay(parsed.context_tokens);
            }
            if (parsed.content) {
              fullContent = parsed.content;
              contentDiv.textContent = fullContent;
            }
            // 渲染审批树
            if (parsed.review_tree) {
              renderReviewTree(parsed.review_tree);
            }
            scrollBottom();
            refreshSessions();
            break;

          case 'cancelled':
            label.textContent = '已中断';
            // 更新上下文 token 数（常驻 header 展示）
            if (parsed.context_tokens != null) {
              updateContextTokensDisplay(parsed.context_tokens);
            }
            if (parsed.content) {
              fullContent = parsed.content;
              contentDiv.textContent = fullContent;
            }
            // 移除光标
            const cursors2 = document.querySelectorAll('.token-cursor');
            cursors2.forEach(c => c.remove());
            scrollBottom();
            refreshSessions();
            break;

          case 'error':
            label.textContent = '❌ 错误';
            contentDiv.textContent = parsed.message;
            break;
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      // 用户主动中断（fallback），不显示错误
      label.textContent = '⏹ 已中断';
      const cursors3 = document.querySelectorAll('.token-cursor');
      cursors3.forEach(c => c.remove());
    } else {
      label.textContent = '❌ 连接错误';
      contentDiv.textContent = err.message;
    }
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    sendBtn.style.display = '';
    stopBtn.style.display = 'none';
    abortController = null;
    scrollBottom();
  }
}

async function stopStreaming() {
  if (!isStreaming) return;

  // 通知后端取消（不主动 abort SSE，让后端自然终止并返回 cancelled 事件）
  if (currentSessionId) {
    try {
      await fetch(`/api/chat/cancel/${currentSessionId}`, { method: 'POST' });
    } catch {}
  }
}

// ============ 工具函数 ============

function appendMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role === 'user' ? 'user' : 'assistant'}`;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? '你' : 'AI';
  const contentDiv = document.createElement('div');
  contentDiv.className = 'content';
  contentDiv.textContent = content;
  div.appendChild(label);
  div.appendChild(contentDiv);
  messagesEl.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function decideTool(toolCallId, approved, cardEl, raiseLimitBy = null) {
  const sid = currentSessionId;
  if (!sid) return;
  try {
    let url = `/api/tools/decide/${sid}/${toolCallId}?approved=${approved}`;
    if (approved && raiseLimitBy != null && raiseLimitBy >= 1) {
      url += `&raise_limit_by=${raiseLimitBy}`;
    }
    await fetch(url, { method: 'POST' });
    // 隐藏审批按钮，显示决策结果
    const actions = cardEl.querySelector('.approval-actions');
    if (actions) {
      const suffix = (raiseLimitBy != null && raiseLimitBy >= 1) ? `（上限 +${raiseLimitBy}）` : '';
      actions.innerHTML = `<span style="font-size:12px;color:${approved ? '#2e7d32' : '#c62828'}">${approved ? '✓ 已通过' + suffix : '✗ 已拒绝'}</span>`;
    }
  } catch (err) {
    console.error('审批请求失败:', err);
  }
}

async function loadReviewTree(sid) {
  try {
    const res = await fetch(`/api/vfs/review/${sid}`);
    const data = await res.json();
    if (data.code === 200 && data.review_tree) {
      renderReviewTree(data.review_tree);
    }
  } catch {
    // 忽略错误（如无审批项时不显示面板）
  }
}

// ============ 审批树渲染 ============

const OP_ICONS = {
  MKDIR: '📁', DELETE_DIR: '🗑', RENAME_DIR: '📁',
  CREATE_FILE: '📄', DELETE_FILE: '🗑', MODIFY_FILE: '✏️', RENAME_FILE: '📄',
};
const OP_LABELS = {
  MKDIR: '创建目录', DELETE_DIR: '删除目录', RENAME_DIR: '重命名目录',
  CREATE_FILE: '新建文件', DELETE_FILE: '删除文件', MODIFY_FILE: '修改文件', RENAME_FILE: '重命名文件',
};

function renderReviewTree(review) {
  const panel = document.getElementById('reviewPanel');
  const taskId = review.task_id || currentSessionId;
  let html = `<div class="review-resize-bar" onmousedown="startReviewDrag(event)"></div>
  <div class="title">
    <span>📋 文件变更审批</span>
    <span class="badge">${review.items.length} 项</span>
    <div class="actions">
      <button class="approve" onclick="processReview('${taskId}', true)">全部通过</button>
      <button class="reject" onclick="processReview('${taskId}', false)">全部拒绝</button>
    </div>
  </div>
  <div class="body">`;

  for (const item of review.items) {
    html += renderReviewItem(item, 0);
  }
  html += '</div>';
  panel.innerHTML = html;
  panel.classList.add('show');
}

// ============ 审批面板拖拽调整大小 ============

let reviewDragState = null;

function startReviewDrag(e) {
  const panel = document.getElementById('reviewPanel');
  reviewDragState = {
    startY: e.clientY,
    startHeight: panel.offsetHeight,
  };
  document.addEventListener('mousemove', onReviewDrag);
  document.addEventListener('mouseup', stopReviewDrag);
  e.preventDefault();
}

function onReviewDrag(e) {
  if (!reviewDragState) return;
  const panel = document.getElementById('reviewPanel');
  const dy = reviewDragState.startY - e.clientY; // 向上拖为正值
  const newHeight = reviewDragState.startHeight + dy;
  // 限制最小高度为标题栏+一点内容，最大为视口80%
  const minH = 80;
  const maxH = window.innerHeight * 0.8;
  panel.style.height = Math.max(minH, Math.min(newHeight, maxH)) + 'px';
}

function stopReviewDrag() {
  reviewDragState = null;
  document.removeEventListener('mousemove', onReviewDrag);
  document.removeEventListener('mouseup', stopReviewDrag);
}

function renderReviewItem(item, depth) {
  const indent = 24 + depth * 20;
  const isDir = ['MKDIR', 'DELETE_DIR', 'RENAME_DIR'].includes(item.op_type);
  const cls = isDir ? 'review-item dir' : 'review-item file';
  const targetStr = item.target ? ` → ${item.target}` : '';
  const copyStr = item.copy_source ? ` <span class="op-copy">(来源: ${item.copy_source})</span>` : '';
  const label = OP_LABELS[item.op_type] || item.op_type;
  const taskId = currentSessionId;

  const actionsHtml = `<div class="item-actions">
      <button class="item-app" onclick="event.stopPropagation();processSingleItem('${taskId}','${item.id}',true)">✓</button>
      <button class="item-rej" onclick="event.stopPropagation();processSingleItem('${taskId}','${item.id}',false)">✗</button>
    </div>`;

  let html = `<div class="${cls}" style="padding-left:${indent}px" data-id="${item.id}">
    <span class="op-icon">${OP_ICONS[item.op_type] || '?'}</span>
    <span class="op-label">${escapeHtml(label)}</span>
    <span class="op-path">${escapeHtml(item.source)}${escapeHtml(targetStr)}${copyStr}</span>
    <span class="op-status pending">待审批</span>
    ${actionsHtml}
  </div>`;

  if (item.children) {
    for (const child of item.children) {
      html += renderReviewItem(child, depth + 1);
    }
  }
  return html;
}

async function processSingleItem(taskId, itemId, approved) {
  try {
    const res = await fetch(`/api/vfs/review/${taskId}/item/${itemId}?approved=${approved}`, { method: 'POST' });
    const data = await res.json();

}

async function loadMemories() {
  const type = document.getElementById('memTypeFilter').value;
  const offset = (memState.page - 1) * memState.limit;
  let url = `/api/memories?limit=${memState.limit}&offset=${offset}`;
  if (type) url += `&memory_type=${encodeURIComponent(type)}`;

  const res = await fetch(url);
  const data = await res.json();
  memState.total = data.total;
  renderMemoryList(data);
}

function renderMemoryList(data) {
  const listEl = document.getElementById('memoryList');
  document.getElementById('memCount').textContent = `${data.total} 条`;

  if (!data.items || data.items.length === 0) {
    listEl.innerHTML = '<div class="empty-state">暂无记忆</div>';
  } else {
    listEl.innerHTML = data.items.map(item => {
      const typeLabels = { preference: '偏好', fact: '事实', identity: '身份' };
      return `<div class="mem-row">
        <span class="mem-type-badge ${item.memory_type}">${typeLabels[item.memory_type] || item.memory_type}</span>
        <span class="mem-content">${escapeHtml(item.value)}</span>
        <div class="mem-actions">
          <button class="edit-btn" onclick="editMemory('${item.id}', '${escapeAttr(item.value)}', '${escapeAttr(item.key)}')">编辑</button>
          <button class="del-btn" onclick="deleteMemory('${item.id}')">删除</button>
        </div>
      </div>`;
    }).join('');
  }

  // 分页按钮状态
  const totalPages = Math.ceil(memState.total / memState.limit) || 1;
  document.getElementById('memPageInfo').textContent = `第 ${memState.page} 页 / 共 ${totalPages} 页`;
  document.getElementById('memPrevBtn').disabled = memState.page <= 1;
  document.getElementById('memNextBtn').disabled = memState.page >= totalPages;
}

function prevMemPage() {
  if (memState.page <= 1) return;
  memState.page--;
  loadMemories();
}

function nextMemPage() {
  const totalPages = Math.ceil(memState.total / memState.limit) || 1;
  if (memState.page >= totalPages) return;
  memState.page++;
  loadMemories();
}

async function editMemory(id, value, key) {
  let newValue = prompt('修改记忆内容:', value);
  if (newValue === null) return;
  newValue = newValue.trim();
  if (!newValue) return;

  let newKey = key;
  const row = document.querySelector(`.mem-row .edit-btn[onclick*="${id}"]`);
  if (row) {
    const badge = row.closest('.mem-row').querySelector('.mem-type-badge');
    if (badge && badge.classList.contains('preference')) {
      newKey = prompt('修改 key（如 language, response_style）:', key || '');
      if (newKey === null) return;
      newKey = newKey.trim();
    }
  }

  const res = await fetch(`/api/memories/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ value: newValue, key: newKey }),
  });
  const data = await res.json();
  if (data.code === 200) {
    loadMemories();
  } else {
    alert('更新失败: ' + (data.message || '未知错误'));
  }
}

async function deleteMemory(id) {
  if (!confirm('确定删除这条记忆？')) return;
  const res = await fetch(`/api/memories/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.code === 200) {
    loadMemories();
  } else {
    alert('删除失败: ' + (data.message || '未知错误'));
  }
}

function escapeAttr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

async function loadSkills() {
  try {
    const res = await fetch('/api/skills');
    const data = await res.json();
    if (data.code === 200) {
      skillState.skillsCache = data.skills;
      renderSkillList(data.skills);
    }
  } catch (err) {
    document.getElementById('skillList').innerHTML = `<div class="empty-state">加载失败: ${escapeHtml(err.message)}</div>`;
  }
}

function renderSkillList(skills) {
  const listEl = document.getElementById('skillList');
  document.getElementById('skillCount').textContent = `${skills.length} 个`;

  if (!skills || skills.length === 0) {
    listEl.innerHTML = '<div class="empty-state">暂无技能</div>';
    return;
  }

  listEl.innerHTML = skills.map(s => {
    const selectedCls = s.name === skillState.selectedName ? ' selected' : '';
    const tagsHtml = (s.tags || []).map(t => `<span class="skill-tag">${escapeHtml(t)}</span>`).join('');
    const disabled = s.disabled;
    const statusCls = disabled ? 'disabled' : 'enabled';
    const statusText = disabled ? '已禁用' : '已启用';
    return `<div class="skill-row${selectedCls}" onclick="showSkillDetail('${escapeAttr(s.name)}')">
      <span class="skill-icon">📦</span>
      <div class="skill-info">
        <span class="skill-name">${escapeHtml(s.name)}</span>
        <span class="skill-version">v${escapeHtml(s.version)}</span>
        <div class="skill-desc">${escapeHtml(s.description)}</div>
        <div class="skill-tags">${tagsHtml}</div>
      </div>
      <div class="skill-status" onclick="event.stopPropagation()">
        <button class="skill-toggle ${statusCls}" onclick="setSkillState('${escapeAttr(s.name)}', ${!disabled})">${statusText}</button>
      </div>
    </div>`;
  }).join('');
}

function showSkillDetail(name) {
  // 直接从缓存中取数据，不重复请求
  const skill = skillState.skillsCache.find(s => s.name === name);
  if (!skill) return;

  skillState.selectedName = name;

  // 高亮选中的行
  document.querySelectorAll('.skill-row').forEach(row => row.classList.remove('selected'));
  const rows = document.querySelectorAll('.skill-row');
  rows.forEach(row => {
    if (row.querySelector('.skill-name')?.textContent === name) {
      row.classList.add('selected');
    }
  });

  // 渲染弹窗
  const disabled = skill.disabled;
  const statusText = disabled ? '已禁用' : '已启用';
  const tagsHtml = (skill.tags || []).map(t => `<span class="detail-tag">${escapeHtml(t)}</span>`).join('');
  const statusCls = disabled ? 'disabled' : 'enabled';

  document.getElementById('skillModalName').innerHTML = `${escapeHtml(skill.name)} <span style="font-size:12px;color:#999;font-weight:normal">v${escapeHtml(skill.version)}</span>`;
  document.getElementById('skillModalBody').innerHTML = `
    <div class="detail-row"><span class="detail-label">描述</span><span class="detail-value">${escapeHtml(skill.description)}</span></div>
    <div class="detail-row"><span class="detail-label">版本</span><span class="detail-value">${escapeHtml(skill.version)}</span></div>
    <div class="detail-row"><span class="detail-label">标签</span><div class="detail-tags">${tagsHtml || '<span style="color:#999">无</span>'}</div></div>
    <div class="detail-row"><span class="detail-label">状态</span><span class="detail-value">${statusText}</span></div>
  `;
  document.getElementById('skillModalFooter').innerHTML = `
    <button class="skill-toggle ${statusCls}" onclick="setSkillState('${escapeAttr(skill.name)}', ${!disabled})">${disabled ? '启用技能' : '禁用技能'}</button>
  `;
  document.getElementById('skillModalOverlay').classList.add('show');
}

function closeSkillDetail(e) {
  // 如果点击的是 overlay 本身（非内部元素），关闭弹窗
  if (e && e.target !== document.getElementById('skillModalOverlay')) return;
  document.getElementById('skillModalOverlay').classList.remove('show');
  skillState.selectedName = null;
  document.querySelectorAll('.skill-row').forEach(row => row.classList.remove('selected'));
}

async function setSkillState(name, disabled) {
  try {
    const res = await fetch(`/api/skills/toggle?name=${encodeURIComponent(name)}&disabled=${disabled}`, { method: 'PUT' });
    const data = await res.json();
    if (data.code === 200) {
      // 刷新列表（会更新缓存并重渲染）
      await loadSkills();
      // 如果弹窗还开着，重新展示
      if (skillState.selectedName === name) {
        showSkillDetail(name);
      }
    } else {
      alert(data.message || '操作失败');
    }
  } catch (err) {
    alert('网络错误: ' + err.message);
  }
}

async function handleSkillUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.zip')) {
    alert('只支持 .zip 格式的文件');
    input.value = '';
    return;
  }

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/skills/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.code === 200) {
      alert(data.message);
      await loadSkills();
    } else {
      alert(data.message || '上传失败');
    }
  } catch (err) {
    alert('网络错误: ' + err.message);
  }
  input.value = '';
}

function renderModelList(models) {
  const el = document.getElementById('modelList');
  if (!models || models.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无模型配置</div>';
    return;
  }
  el.innerHTML = models.map(m => {
    const thinkLabel = m.think ? '思考: 开' : '思考: 关';
    const reLabel = m.reasoning_effort ? `推理: ${m.reasoning_effort}` : '';
    const advInfo = [thinkLabel, reLabel].filter(Boolean).join(' · ');
    return `
    <div class="model-row">
      <div class="model-info">
        <div class="model-name">${escapeHtml(m.name)}</div>
        <div class="model-detail">${escapeHtml(m.model)} · ${escapeHtml(m.base_url)}</div>
        <div class="model-detail" style="font-size:11px;color:#888;">Temp: ${m.temperature ?? 0.7} · 迭代上限: ${m.max_iterations ?? 30}${advInfo ? ' · ' + advInfo : ''}</div>
      </div>
      <div class="model-status">
        <span class="model-badge active">活跃</span>
      </div>
      <div class="model-actions">
        <button class="edit-btn" onclick="editModel('${m.id}')">编辑</button>
        <button class="del-btn" onclick="deleteModel('${m.id}')">删除</button>
      </div>
    </div>
  `;}).join('');
}

async function loadModelSelector() {
  try {
    const res = await fetch('/api/models');
    const models = await res.json();
    modelList = models;
    // 模型配置加载完成后，按最新上限重算百分比展示
    updateContextTokensDisplay(lastContextTokens);
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = models.map(m =>
      `<option value="${m.id}" ${m.id === selectedModelId ? 'selected' : ''}>${escapeHtml(m.name)} (${escapeHtml(m.model)})</option>`
    ).join('');
    if (models.length === 0) {
      sel.innerHTML = '<option value="">无可用模型，请先在模型管理中配置</option>';
      selectedModelId = '';
      sendBtn.disabled = true;
      sendBtn.title = '请先在模型管理中配置模型';
    } else if (!selectedModelId || !models.find(m => m.id === selectedModelId)) {
      // 未选择或已选模型已被删除，自动选第一个
      selectedModelId = models[0].id;
      sel.value = selectedModelId;
      localStorage.setItem('selected_model_id', selectedModelId);
      sendBtn.disabled = false;
      sendBtn.title = '';
    } else {
      sendBtn.disabled = false;
      sendBtn.title = '';
    }
  } catch {
    document.getElementById('modelSelect').innerHTML = '<option value="">加载失败</option>';
    sendBtn.disabled = true;
  }
}

function onModelChange() {
  selectedModelId = document.getElementById('modelSelect').value;
  localStorage.setItem('selected_model_id', selectedModelId);
  // 切换模型后按新上限重算百分比展示
  updateContextTokensDisplay(lastContextTokens);
  if (selectedModelId) {
    sendBtn.disabled = false;
    sendBtn.title = '';
  } else {
    sendBtn.disabled = true;
    sendBtn.title = '请选择一个模型';
  }
}

async function saveModel() {
  const editId = document.getElementById('editModelId').value;
  const name = document.getElementById('modelFormName').value.trim();
  const base_url = document.getElementById('modelFormUrl').value.trim();
  const model = document.getElementById('modelFormModel').value.trim();
  const api_key = document.getElementById('modelFormKey').value.trim();
  const max_context_tokens = parseInt(document.getElementById('modelFormCtxTokens').value) || 200000;
  const max_output_tokens = parseInt(document.getElementById('modelFormMaxTokens').value) || 64000;
  const max_tool_calls = parseInt(document.getElementById('modelFormMaxToolCalls').value) || 50;
  const temperature = parseFloat(document.getElementById('modelFormTemperature').value) || 0.7;
  const max_iterations = parseInt(document.getElementById('modelFormMaxIterations').value) || 30;
  const think = parseInt(document.getElementById('modelFormThink').value);
  const reasoning_effort = document.getElementById('modelFormReasoningEffort').value || null;

  if (!name || !base_url || !model || !api_key) {
    alert('所有字段都不能为空');
    return;
  }

  try {
    let res;
    const body = { name, base_url, model, api_key, max_context_tokens, max_output_tokens, max_tool_calls, temperature, max_iterations, think, reasoning_effort };
    if (editId) {
      res = await fetch(`/api/models/${editId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } else {
      res = await fetch('/api/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }
    const result = await res.json();
    if (result.code === 200) {
      hideModelForm();
      await loadModels();
      await loadModelSelector();
    } else {
      alert(result.message || '操作失败');
    }
  } catch (err) {
    alert('网络错误: ' + err.message);
  }
}
