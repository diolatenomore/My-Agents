# Web Research Skill

## 研究流程
1. **明确主题**：理解用户要求的研究方向
2. **搜索资料**：
   - 使用 tavily_search 进行多关键词搜索
   - 至少执行 2-3 次不同角度的搜索
3. **信息提取**：
   - 摘要：50字概括主题
   - 关键发现：3-5条核心观点，带数据支撑
4. **保存结果**：
   - 调用 write_file 写入文件
   - 路径：./agent_workspace/research/{主题}_研究.md
   - 格式：Markdown

## 输出文件格式
```markdown
# {主题} 研究报告

## 摘要
[100字概述]

## 关键发现
1. **[观点]**：[详细说明，带数据来源]
2. **[观点]**：[详细说明]
3. ...

## 数据来源
- [来源1标题](链接)
- [来源2标题](链接)
